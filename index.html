<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Question For You 💍</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #1a0a0f;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Lato", sans-serif;
        overflow: hidden;
        position: relative;
      }

      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }

      .star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        animation: twinkle var(--d) ease-in-out infinite alternate;
        opacity: 0;
      }

      @keyframes twinkle {
        0% {
          opacity: 0.1;
          transform: scale(1);
        }
        100% {
          opacity: 0.8;
          transform: scale(1.3);
        }
      }

      .petals-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .petal {
        position: absolute;
        top: -40px;
        font-size: 18px;
        animation: fall linear infinite;
        opacity: 0.7;
      }

      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0deg) translateX(0);
          opacity: 0.8;
        }
        50% {
          transform: translateY(50vh) rotate(180deg) translateX(30px);
        }
        100% {
          transform: translateY(110vh) rotate(360deg) translateX(-20px);
          opacity: 0;
        }
      }

      .card {
        position: relative;
        z-index: 10;
        text-align: center;
        padding: 3rem 3.5rem;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 180, 180, 0.2);
        backdrop-filter: blur(10px);
        max-width: 500px;
        width: 90%;
        animation: fadeUp 1.2s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .ring-icon {
        font-size: 64px;
        display: block;
        margin-bottom: 1.2rem;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.12);
        }
      }

      h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 400;
        color: #fce4ec;
        letter-spacing: 0.02em;
        line-height: 1.3;
        margin-bottom: 0.5rem;
        animation: fadeUp 1.4s ease both;
      }

      h1 em {
        font-style: italic;
        color: #f48fb1;
      }

      .subtitle {
        font-size: 0.95rem;
        color: rgba(255, 200, 200, 0.5);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 2.5rem;
        animation: fadeUp 1.6s ease both;
      }

      .buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        position: relative;
      }

      #btn-yes {
        background: linear-gradient(135deg, #e91e63, #c2185b);
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 0.85rem 2.2rem;
        font-family: "Playfair Display", serif;
        font-size: 1.15rem;
        cursor: pointer;
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        box-shadow: 0 4px 20px rgba(233, 30, 99, 0.4);
        position: relative;
        z-index: 5;
        min-width: 120px;
        white-space: nowrap;
      }

      #btn-yes:hover {
        transform: scale(1.06);
        box-shadow: 0 6px 30px rgba(233, 30, 99, 0.6);
      }

      #btn-no {
        background: transparent;
        color: rgba(255, 200, 200, 0.5);
        border: 1px solid rgba(255, 200, 200, 0.25);
        border-radius: 50px;
        padding: 0.85rem 2.2rem;
        font-family: "Lato", sans-serif;
        font-size: 1rem;
        cursor: pointer;
        position: fixed;
        z-index: 20;
        min-width: 100px;
        white-space: nowrap;
        transition: opacity 0.4s ease;
      }

      .no-count-msg {
        font-size: 0.8rem;
        color: rgba(255, 200, 200, 0.35);
        margin-top: 1.2rem;
        min-height: 1.2em;
        letter-spacing: 0.08em;
        font-style: italic;
        animation: fadeUp 0.4s ease both;
      }

      #yes-screen {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #1a0a0f;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1rem;
        text-align: center;
        animation: fadeIn 0.8s ease both;
      }

      #yes-screen.visible {
        display: flex;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .yes-emoji {
        font-size: 80px;
        animation: bounce 0.8s ease infinite alternate;
      }

      @keyframes bounce {
        from {
          transform: translateY(0) scale(1);
        }
        to {
          transform: translateY(-16px) scale(1.1);
        }
      }

      .yes-title {
        font-family: "Playfair Display", serif;
        font-size: clamp(2.2rem, 6vw, 4rem);
        color: #fce4ec;
        font-style: italic;
      }

      .yes-sub {
        font-size: 1rem;
        color: rgba(255, 200, 200, 0.6);
        letter-spacing: 0.12em;
      }

      .hearts-burst {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        overflow: hidden;
      }

      .h-heart {
        position: absolute;
        font-size: 28px;
        animation: flyUp 2s ease forwards;
        opacity: 0;
      }

      @keyframes flyUp {
        0% {
          opacity: 1;
          transform: translateY(0) scale(0.5) rotate(0deg);
        }
        60% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-80vh) scale(1.5) rotate(var(--r));
        }
      }
    </style>
  </head>
  <body>
    <div class="stars" id="stars"></div>
    <div class="petals-container" id="petals"></div>

    <div class="card" id="main-card">
      <span class="ring-icon">💍</span>
      <h1>Will you<br /><em>marry me?</em></h1>
      <p class="subtitle">My heart is asking</p>

      <div class="buttons">
        <button id="btn-yes" onclick="sayYes()">Yes! 💖</button>
        <button id="btn-no">No</button>
      </div>

      <p class="no-count-msg" id="no-msg"></p>
    </div>

    <div id="yes-screen">
      <div class="hearts-burst" id="hearts-burst"></div>
      <div class="yes-emoji">💍</div>
      <h2 class="yes-title">She said YES!</h2>
      <p class="yes-sub">The happiest moment ✨</p>
    </div>

    <script>
      const noMessages = [
        "Nope, not today! 😜",
        "Too slow! 💨",
        "Catch me if you can! 🏃‍♀️",
        "Hehe, missed again! 😄",
        "I'm too quick for you! ✨",
        "Almost… but not quite! 😉",
        "That button doesn't want to be clicked! 🙈",
        "Maybe try the other button? 💖",
        "It's running away from you! 😂",
        "Give up and say yes! 🥺",
        "The 'No' is hiding for good now… 😅",
      ];

      let escapeCount = 0;
      const btnYes = document.getElementById("btn-yes");
      const btnNo = document.getElementById("btn-no");
      const noMsg = document.getElementById("no-msg");

      function getRandomPosition() {
        const card = document.getElementById("main-card");
        const cardRect = card.getBoundingClientRect();
        const bw = btnNo.offsetWidth || 110;
        const bh = btnNo.offsetHeight || 48;
        const margin = 10;
        const x =
          cardRect.left +
          margin +
          Math.random() * (cardRect.width - bw - margin * 2);
        const y =
          cardRect.top +
          margin +
          Math.random() * (cardRect.height - bh - margin * 2);
        return { x, y };
      }

      function placeNoButton() {
        const { x, y } = getRandomPosition();
        btnNo.style.left = x + "px";
        btnNo.style.top = y + "px";
      }

      function escapeNo() {
        escapeCount++;
        const idx = Math.min(escapeCount - 1, noMessages.length - 1);
        noMsg.textContent = noMessages[idx];
        placeNoButton();
      }

      btnNo.addEventListener("mouseenter", escapeNo);
      btnNo.addEventListener("touchstart", escapeNo);

      let yesScale = 1;
      btnYes.addEventListener("mouseenter", () => {
        yesScale = Math.min(yesScale + 0.15, 4);
        btnYes.style.transform = `scale(${yesScale})`;
        btnYes.style.transition = "transform 0.3s ease, box-shadow 0.3s ease";
      });

      window.addEventListener("load", () => {
        placeNoButton();
      });
      window.addEventListener("resize", () => {
        placeNoButton();
      });

      function sayYes() {
        document.getElementById("yes-screen").classList.add("visible");
        burstHearts();
        setTimeout(burstHearts, 600);
        setTimeout(burstHearts, 1200);
      }

      function burstHearts() {
        const container = document.getElementById("hearts-burst");
        const emojis = ["❤️", "💕", "💖", "💗", "💓", "🌹", "✨", "💍"];
        for (let i = 0; i < 20; i++) {
          const h = document.createElement("span");
          h.className = "h-heart";
          h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          h.style.left = Math.random() * 100 + "vw";
          h.style.bottom = "0";
          h.style.animationDelay = Math.random() * 0.8 + "s";
          h.style.setProperty("--r", Math.random() * 60 - 30 + "deg");
          container.appendChild(h);
          setTimeout(() => h.remove(), 2500);
        }
      }

      const starsEl = document.getElementById("stars");
      for (let i = 0; i < 120; i++) {
        const s = document.createElement("div");
        s.className = "star";
        const size = Math.random() * 2.5 + 0.5;
        s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random() * 100}%;left:${Math.random() * 100}%;--d:${(Math.random() * 3 + 1.5).toFixed(1)}s;animation-delay:${(Math.random() * 4).toFixed(1)}s;`;
        starsEl.appendChild(s);
      }

      const petalsEl = document.getElementById("petals");
      const petalEmojis = ["🌸", "🌹", "🌺", "💮", "🏵️"];
      for (let i = 0; i < 18; i++) {
        const p = document.createElement("span");
        p.className = "petal";
        p.textContent =
          petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
        p.style.cssText = `left:${Math.random() * 100}%;font-size:${Math.random() * 14 + 10}px;animation-duration:${(Math.random() * 8 + 6).toFixed(1)}s;animation-delay:${(Math.random() * 10).toFixed(1)}s;`;
        petalsEl.appendChild(p);
      }
    </script>
  </body>
</html>
